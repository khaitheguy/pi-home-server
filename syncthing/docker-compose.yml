services:
  syncthing:
    image: syncthing/syncthing:latest
    container_name: syncthing
    hostname: raspberrypi-syncthing
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Singapore
      - STGUIADDRESS=0.0.0.0:8384
    network_mode: host
    volumes:
      - ./config:/var/syncthing/config
      - /mnt/ssd/media:/data
    restart: unless-stopped
